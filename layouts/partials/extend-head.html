<link rel="stylesheet" href="{{ "access-gate.css" | relURL }}">
<script src="{{ "access-gate.js" | relURL }}"></script>

<style>
/* Ensure navigation typography even if theme custom SCSS is not bundled. */
#header .header-title, .header .header-title,
#header .menu .menu-item, .header .menu .menu-item,
#header .menu .menu-item a, .header .menu .menu-item a,
#header .menu a, .header .menu a {
  font-weight: 800 !important;
  text-transform: uppercase !important;
  letter-spacing: .035em;
}
#footer .footer-container, .footer .footer-container,
#footer a, .footer a {
  font-weight: 800;
  text-transform: uppercase;
}
</style>

<style>
/* Editorial menu: match bold uppercase magazine navigation; retain current colors. */
#header .menu-container .menu-item,
#header .menu-container .menu-item a,
#header .menu-container .menu-item span,
#header .menu-container .menu-inner a,
#header nav a,
.header .menu-container a,
.header .menu a,
#header .header-title a {
  text-transform: uppercase !important;
  font-weight: 800 !important;
  letter-spacing: .035em !important;
}
#footer a, #footer .footer-container, footer a {
  text-transform: uppercase !important;
  font-weight: 800 !important;
}
/* Remove all DoIt theme-selection widgets, including mobile variants. */
#theme-switch, #theme-select, #theme-toggle,
.theme-switch, .theme-select, .theme-toggle,
.theme-switcher, [id^="theme-switch"], [id^="theme-select"] {
  display: none !important;
}
</style>
<script>
/* Force light before theme initialization and discard an older dark preference. */
try {
  localStorage.setItem("theme", "light");
} catch (e) {}
document.documentElement.setAttribute("data-theme","light");
</script>

<style>
/* DoIt header actually uses .menu-inner and .menu-item; do not recolor text. */
#header .menu-inner .menu-item,
#header .menu-inner .menu-item a,
#header .menu-inner .menu-item span,
#header .menu-inner a,
#header .menu-container .menu-inner,
#header .menu-container .menu-inner a,
#header .header-title a {
  text-transform: uppercase !important;
  font-weight: 800 !important;
}
#header .menu-inner .menu-item { letter-spacing: .035em !important; }
#header #theme-switch,
#header .theme-switch,
#header #theme-select,
#header .theme-select,
#header [class*="theme-switch"],
#header [id*="theme-switch"],
#header [class*="theme-select"],
#header [id*="theme-select"] { display:none !important; }
</style>
<script>
/* Remove the theme control after render, including controls generated by DoIt JS. */
(function () {
  function apply() {
    document.documentElement.setAttribute("data-theme", "light");
    document.body && document.body.setAttribute("data-theme", "light");
    document.querySelectorAll('#header #theme-switch,#header .theme-switch,#header #theme-select,#header .theme-select,#header [class*="theme-switch"],#header [id*="theme-switch"],#header [class*="theme-select"],#header [id*="theme-select"]').forEach(function(el) { el.remove(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", apply);
  else apply();
})();
</script>
