name: Automatic conflict resolver
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Auto Merge PR After Green Tests"]
    types: [completed]
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: automatic-conflict-resolver
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Run trusted resolver outside PR checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cp scripts/conflict-resolver.py "$RUNNER_TEMP/conflict-resolver.py"
          python3 "$RUNNER_TEMP/conflict-resolver.py"
