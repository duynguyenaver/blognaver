name: Build and deploy Hugo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish the newest main revision; cancel outdated queued/running deploys.
concurrency:
  group: blognaver-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
          cache: false
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Cache Hugo module downloads and build resources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-v2-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-v2-
      # Hugo downloads missing pinned modules during build.
      # Do not run "hugo mod get" on every deployment: it may change module versions.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL 'https://duynguyenaver.github.io/blognaver/'
      - name: Generate complete CMS post index (including drafts)
        run: node scripts/generate-cms-index.mjs
      - name: Snapshot recent workflows for API fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-workflow-snapshot.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Summarize deployment
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo '## BlogNaver deployment'
            echo ""
            echo "- Commit: \`$SHA\`"
            echo "- Workflow run: $RUN_ID"
            echo "- Published URL: $URL"
            echo "- Status: successful Pages deploy"
          } >> "$GITHUB_STEP_SUMMARY"

  start-language-lab:
    name: Trigger vocabulary AI after Pages deploy
    needs: deploy
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch vocabulary sync with repository owner's credentials
        env:
          GH_TOKEN: ${{ secrets.BLOGNAVER_VOCAB_BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::No owner PAT. Skipping Language Lab dispatch, never dispatching as github-actions[bot]."
            echo "## Vocabulary sync not dispatched" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure repository Actions secret BLOGNAVER_VOCAB_BOT_TOKEN for the duynguyenaver account." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ACTOR="$(gh api user --jq .login)"
          if [ "$ACTOR" != "duynguyenaver" ]; then
            echo "::error::Only duynguyenaver may dispatch vocabulary sync. Got: $ACTOR."
            exit 1
          fi
          gh api -X POST "repos/$REPO/actions/workflows/trilingual-vocabulary-sync.yml/dispatches" -f ref=main
          echo "::notice::Language Lab dispatched by authenticated owner $ACTOR."
          echo "## Vocabulary sync dispatched as $ACTOR" >> "$GITHUB_STEP_SUMMARY"
