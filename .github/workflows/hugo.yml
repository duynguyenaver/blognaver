name: Build and deploy Hugo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every pushed revision gets a run. Queue instead of canceling intermediate runs.
# GitHub can retain up to 100 pending runs with queue: max.
concurrency:
  group: blognaver-pages-production
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Cache Hugo module downloads and build resources
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-v2-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-v2-
      # Hugo downloads missing pinned modules during build.
      # Do not run "hugo mod get" on every deployment: it may change module versions.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL 'https://duynguyenaver.github.io/blognaver/'
      - name: Generate complete CMS post index (including drafts)
        run: node scripts/generate-cms-index.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarize deployment
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo '## BlogNaver deployment'
            echo ""
            echo "- Commit: \`$SHA\`"
            echo "- Workflow run: $RUN_ID"
            echo "- Published URL: $URL"
            echo "- Status: successful Pages deploy"
          } >> "$GITHUB_STEP_SUMMARY"
