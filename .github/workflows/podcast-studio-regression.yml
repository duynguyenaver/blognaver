name: Podcast Studio · Regression
on:
  pull_request:
    paths:
      - 'static/tien-ich/tao-podcast/**'
      - 'scripts/test-podcast-studio.cjs'
      - '.github/workflows/podcast-studio-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  podcast-studio:
    name: Validate Podcast Studio
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JS syntax
        run: |
          node --check static/tien-ich/tao-podcast/studio.js
          node --check static/tien-ich/tao-podcast/audio-engine.js
      - name: Test Podcast Studio WAV encoding and UI bindings
        run: node scripts/test-podcast-studio.cjs
