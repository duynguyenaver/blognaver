name: Language Lab · Google Sheets to offline notes to PR
on:
  pull_request:
    paths:
      - 'scripts/sync-trilingual-vocabulary.py'
      - 'scripts/test-sync-trilingual-vocabulary.py'
      - 'scripts/offline_trilingual_vocabulary.py'
      - 'scripts/trilingual-offline-notes.json'
      - 'scripts/test-vocab-library-pager.mjs'
      - 'static/tien-ich/hoc-tieng-viet-han-anh/**'
      - '.github/workflows/trilingual-vocabulary-sync.yml'
  workflow_dispatch:
  # Hugo dispatches this workflow explicitly after Pages deployment.
  # workflow_dispatch and schedule run the same importer.
  schedule:
    - cron: '3/5 * * * *' # GitHub Actions minimum is 5 minutes; avoid top-of-hour congestion

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: blognaver-vocabulary-sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test parsing, stable IDs, Vietnamese/Korean/English mapping
        run: |
          python3 scripts/test-sync-trilingual-vocabulary.py -v
          python3 scripts/test-offline-trilingual-vocabulary.py -v
      - name: Test newest-first vocabulary ordering and 3-item live pagination
        run: node scripts/test-vocab-library-pager.mjs
      - name: Syntax check
        run: |
          python3 -m py_compile scripts/sync-trilingual-vocabulary.py scripts/offline_trilingual_vocabulary.py
          python3 -m json.tool scripts/trilingual-offline-notes.json >/dev/null
          node --check static/tien-ich/hoc-tieng-viet-han-anh/study.js
          node --check static/tien-ich/hoc-tieng-viet-han-anh/vocab-order.js
          node --check static/tien-ich/hoc-tieng-viet-han-anh/live-sheet.js
          bash -n scripts/merge-verified-vocabulary-pr.sh
          node -e "new Function(require('fs').readFileSync('docs/google-apps-script/LanguageLab.gs', 'utf8'))"
          python3 -m json.tool static/tien-ich/hoc-tieng-viet-han-anh/vocabulary.json >/dev/null

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Install Google Drive authentication library
        run: python3 -m pip install --disable-pip-version-check --quiet 'google-auth>=2.0,<3.0' 'requests>=2,<3'
      - name: Verify vocabulary importer
        run: |
          python3 scripts/test-sync-trilingual-vocabulary.py -q
          python3 scripts/test-offline-trilingual-vocabulary.py -q
      - name: Skip duplicate pending vocabulary sync PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.BLOGNAVER_VOCAB_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          PR="$(gh pr list --repo "$REPO" --state open --json title,number,headRefOid --jq '[.[]|select(.title=="data(vocab): sync Google Drive Sheets")][0] // {}')"
          NUMBER="$(jq -r '.number // empty' <<<"$PR")"
          if [ -n "$NUMBER" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "pr=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r '.headRefOid' <<<"$PR")" >> "$GITHUB_OUTPUT"
            echo "Existing pending generated data PR #$NUMBER. Attempt recovery with verified CI."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Auto-merge previously pending data PR after verified green CI
        if: steps.existing.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.BLOGNAVER_VOCAB_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.existing.outputs.pr }}
          HEAD_SHA: ${{ steps.existing.outputs.sha }}
        run: bash scripts/merge-verified-vocabulary-pr.sh "$PR_NUMBER" "$HEAD_SHA"
      - name: Read all Sheets and enrich only new/modified words
        if: steps.existing.outputs.skip == 'false'
        env:
          VOCAB_DRIVE_FOLDER_ID: '1coylrqzqPOLZP_lhUdWlb3nI47Qr-af7'
          VOCAB_PUBLIC_SHEET_IDS: '19nL6wtouHV-0OumsQR2jF-5xWA1cpbpivRUIsm7hDgk'
          VOCAB_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.VOCAB_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOCAB_OFFLINE_ONLY: "0"
          VOCAB_WRITEBACK_SHEETS: "1"
          VOCAB_MAX_GEMINI_ITEMS: '200'
        run: python3 scripts/sync-trilingual-vocabulary.py
      - name: Create data branch and Pull Request (never commit to main)
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.BLOGNAVER_VOCAB_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          DATA='static/tien-ich/hoc-tieng-viet-han-anh/vocabulary.json'
          if git diff --quiet -- "$DATA"; then
            echo "No changes: Google Sheets and cached Gemini results are unchanged."
            exit 0
          fi
          BRANCH="data/vocab-drive-sync-$RUN_ID"
          git config user.name "BlogNaver Vocabulary Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "$DATA"
          git commit -m "data(vocab): sync trilingual Google Sheets and offline grammar notes"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
          PR_URL="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title 'data(vocab): sync Google Drive Sheets' \
            --body 'Automated refresh from the owner-approved Drive folder; exact row provenance, offline curated and rule-based learning explanations, and fail-closed errors. No keys committed.')"
          echo "::notice::Created generated vocabulary PR: $PR_URL"
          PR_NUMBER="$(basename "$PR_URL")"
          HEAD_SHA="$(git rev-parse HEAD)"
          # Avoid gh pr merge --auto: GitHub requires branch protection for that
          # feature, which this repository currently does not configure.
          # Inspect exact changed-file scope and await the actual CI green checks.
          bash scripts/merge-verified-vocabulary-pr.sh "$PR_NUMBER" "$HEAD_SHA"
