name: Monthly expenses · Private Google Sheets encrypted sync
on:
  pull_request:
    paths:
      - 'static/tien-ich/chi-phi-thang/**'
      - 'scripts/sync-monthly-expenses.py'
      - 'scripts/test-sync-monthly-expenses.py'
      - 'scripts/test-monthly-expenses-apps-script.mjs'
      - 'scripts/finance-conflict-resolver.py'
      - 'scripts/test-finance-conflict-resolver.py'
      - '.github/workflows/finance-conflict-resolver.yml'
      - 'docs/google-apps-script/MonthlyExpenses.gs'
      - 'scripts/test-finance-report.mjs'
      - '.github/workflows/monthly-expenses-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('blognaver-finance-ci-{0}', github.event.pull_request.number) || 'blognaver-finance-data-pr' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install encryption and HTTP libraries
        run: python3 -m pip install --quiet 'cryptography>=42,<48' 'requests>=2,<3'
      - name: Test parsing, schema and encryption
        run: |
          python3 scripts/test-sync-monthly-expenses.py -v
          python3 scripts/test-finance-conflict-resolver.py -v
          python3 -m py_compile scripts/finance-conflict-resolver.py
          python3 -m py_compile scripts/sync-monthly-expenses.py
          node --check static/tien-ich/chi-phi-thang/app.js
          node scripts/test-monthly-expenses-apps-script.mjs
          node --check static/tien-ich/chi-phi-thang/finance-report.js
          node scripts/test-finance-report.mjs
          node -e "new Function(require('fs').readFileSync('docs/google-apps-script/MonthlyExpenses.gs','utf8'))"
          test ! -e static/tien-ich/chi-phi-thang/data.json
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Install encryption and HTTP libraries
        run: python3 -m pip install --quiet 'cryptography>=42,<48' 'requests>=2,<3'
      - name: Read private spreadsheet via owner Apps Script and encrypt
        env:
          MONTHLY_EXPENSES_APPS_SCRIPT_URL: ${{ vars.MONTHLY_EXPENSES_APPS_SCRIPT_URL }}
          MONTHLY_EXPENSES_APPS_SCRIPT_TOKEN: ${{ secrets.MONTHLY_EXPENSES_APPS_SCRIPT_TOKEN }}
          MONTHLY_EXPENSES_ENCRYPTION_PASSPHRASE: ${{ secrets.MONTHLY_EXPENSES_ENCRYPTION_PASSPHRASE }}
          MONTHLY_EXPENSES_SHEET_ID: '1gxikPCOe62Be2_Lp5n3m6HMfCdnh-8WT5apJZeEvM7E'
        run: python3 scripts/sync-monthly-expenses.py
      - name: Finance Conflict Resolver · preflight and safe data PR
        env:
          GH_TOKEN: ${{ secrets.BLOGNAVER_VOCAB_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=static/tien-ich/chi-phi-thang/data.enc.json
          if git diff --quiet -- "$FILE" && [ -z "$(git ls-files --others --exclude-standard -- "$FILE")" ]; then
            echo "No changed finance data; skip PR."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing BLOGNAVER_VOCAB_BOT_TOKEN"
            exit 1
          fi
          python3 scripts/finance-conflict-resolver.py publish
