name: LoL Contract Tracker · Tests
on:
  pull_request:
    paths:
      - 'static/tien-ich/lol-contract-tracker/**'
      - 'static/tien-ich/index.html'
      - 'scripts/update-lol-contracts.py'
      - 'scripts/test_update_lol_contracts.py'
      - 'scripts/test-lol-contract-tracker.mjs'
      - 'scripts/update-lol-gcd-archive.py'
      - 'scripts/test_update_lol_gcd_archive.py'
      - 'scripts/test-lol-contract-archive.mjs'
      - '.github/workflows/lol-contract-tracker-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tracker:
    name: GCD parser and UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check JS parse
        run: node --check static/tien-ich/lol-contract-tracker/tracker.js
      - name: Python GCD importer offline tests
        run: python3 -m unittest scripts/test_update_lol_contracts.py -v
      - name: Client data and contract labels tests
        run: node --test scripts/test-lol-contract-tracker.mjs
      - name: Probe Riot public GCD source (read-only, non-blocking)
        continue-on-error: true
        run: python3 scripts/update-lol-contracts.py --check
      - name: Historical archive index Python regression
        run: python3 -m unittest scripts/test_update_lol_gcd_archive.py -v
      - name: Historical archive browser regression
        run: node --test scripts/test-lol-contract-archive.mjs
      - name: Check historical UI JavaScript parse
        run: node --check static/tien-ich/lol-contract-tracker/archive.js
      - name: Check JSON schema and attribution
        run: |
          python3 - <<'PY'
          import json
          base="static/tien-ich/lol-contract-tracker/"
          data=json.load(open(base+"gcd.json",encoding="utf-8"))
          news=json.load(open(base+"transfers.json",encoding="utf-8"))
          assert data["version"]==1 and isinstance(data["rows"],list)
          assert "docs.google.com/spreadsheets/" in data["sourceUrl"]
          for event in news["events"]:
              assert event["status"] in ("confirmed","renewed","rumor")
              assert event["sourceUrl"].startswith("https://")
              assert event["date"] and event["player"]
          archive=json.load(open(base+"archive.json",encoding="utf-8"))
          assert archive["sourceType"]=="unofficial-community-history"
          assert archive["sourceUrl"].startswith("https://lol.fandom.com/wiki/")
          assert "CC BY-SA" in archive["license"]
          for region in archive["regions"]:
              assert region["indexUrl"].startswith("https://lol.fandom.com/wiki/Archive:Global_Contract_Database/")
              assert len(region["dates"])<=36
          print("PASS: Riot GCD sources, community historical provenance and attributed transfer events")
          PY
