name: Auto-review after Bug Checker

on:
  workflow_run:
    workflows: ["PR Bug Checker"]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write

jobs:
  auto-review:
    name: Approve only verified green PR
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Review checked and unchanged PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const run = context.payload.workflow_run;
            let prs = run.pull_requests || [];
            if (!prs.length) {
              const {data: associated} = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner, repo, commit_sha: run.head_sha});
              prs = associated.filter(p => p.state === 'open');
            }
            if (prs.length !== 1) {
              core.warning('No unique PR associated with this check. Manual review required.');
              return;
            }
            const number = prs[0].number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.warning('PR is closed, draft or from a fork; skipping auto review.');
              return;
            }
            // Never approve stale checks, even if the branch moved while the check ran.
            if (pr.head.sha !== run.head_sha) {
              core.warning('PR changed after Bug Checker passed. No auto approval.');
              return;
            }
            const {data: runJobs} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            if (!runJobs.jobs.some(job => job.name === 'Bug Checker — Blowfish (3 attempts max)' && job.conclusion === 'success')) {
              core.warning('Expected Bug Checker job did not pass.');
              return;
            }
            const {data: checks} = await github.rest.checks.listForRef({
              owner, repo, ref: pr.head.sha, per_page: 100
            });
            const blocking = checks.check_runs.filter(check =>
              check.name !== 'Approve only verified green PR' &&
              (check.conclusion === 'failure' || check.conclusion === 'timed_out' ||
               check.conclusion === 'cancelled' || check.conclusion === 'action_required')
            );
            if (blocking.length) {
              core.warning('Other checks have failed: '+blocking.map(c => c.name).join(', '));
              return;
            }
            try {
              await github.rest.pulls.createReview({
                owner, repo, pull_number: number,
                event: 'APPROVE',
                body: '✅ Automated review: Bug Checker passed and the PR head SHA is unchanged. This is a CI approval, not a human code review. Merge remains manual.'
              });
              core.notice(`Submitted CI APPROVE review for PR #${number}; no merge performed.`);
            } catch (e) {
              // GitHub may disallow Actions approvals through repository settings,
              // or reject self-approval. Preserve the PASS check; never bypass policy.
              core.warning('GitHub rejected automatic approval: '+e.message+
                '. Repository owner may enable Actions approvals under Settings → Actions → General, or approve manually.');
            }
