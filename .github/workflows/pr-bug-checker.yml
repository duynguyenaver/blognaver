name: PR Bug Checker

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bug-checker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bug-checker:
    name: Bug Checker — Blowfish (3 attempts max)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Bug checks, known-fix guidance and 2 retries
        shell: bash
        run: |
          chmod +x scripts/pr-bug-checker.sh
          for attempt in 1 2 3; do
            echo "::group::Bug Checker attempt $attempt/3"
            if bash scripts/pr-bug-checker.sh 2>&1 | tee "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::endgroup::"
              echo "## ✅ Bug Checker PASS" >> "$GITHUB_STEP_SUMMARY"
              echo "Passed attempt $attempt/3. CI auto-review may proceed; merge is manual." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            # Knowledge-base classification is advisory; no code is modified.
            python3 scripts/ci-classify-failure.py --log "$RUNNER_TEMP/bug-check-$attempt.log" --out "$RUNNER_TEMP/bug-diagnosis-$attempt.json"
            echo "### Attempt $attempt: known-issue analysis" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/bug-diagnosis-$attempt.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          if not report["matches"]:
              print("- Unclassified failure: inspect raw logs and official Hugo / GitHub docs.")
          for case in report["matches"]:
              print("- **"+case["title"]+"** ("+case["kind"]+"): "+case["advice"]+" [Documentation]("+case["source"]+")")
          print("- Classification is heuristic; no source files were changed.")
          PY
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Retry after 10s (attempt $((attempt+1))/3)."
              sleep 10
            fi
          done
          echo "::error::Bug Checker failed all 3 attempts; stop here."
          echo "## ❌ Bug Checker FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "All three attempts failed. No approval or merge; human intervention required." >> "$GITHUB_STEP_SUMMARY"
          exit 1
