name: PR Bug Checker

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bug-checker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bug-checker:
    name: Bug Checker — Stack + Prism (3 attempts max)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Install official Dart Sass executable
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/sass/dart-sass/releases/download/1.93.2/dart-sass-1.93.2-linux-x64.tar.gz -o "$RUNNER_TEMP/dart-sass.tar.gz"
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart-sass/sass" --version
      - name: Install pinned Prism module
        run: go get github.com/CaiJimmy/hugo-theme-prism@3bfc3735f20e3e3c0cdac91cda7dc52155074030
      - name: Bug checks with 2 automatic retries
        shell: bash
        run: |
          chmod +x scripts/pr-bug-checker.sh
          for attempt in 1 2 3; do
            echo "::group::Bug checker attempt $attempt of 3"
            if bash scripts/pr-bug-checker.sh; then
              echo "::endgroup::"
              echo "## ✅ Bug Checker: PASS" >> "$GITHUB_STEP_SUMMARY"
              echo "All checks passed on attempt $attempt/3. Ready for human review; no automatic approval or merge." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Attempt $attempt failed; repeating after 10 seconds."
              sleep 10
            fi
          done
          echo "::error::Bug Checker failed all 3 attempts."
          echo "## ❌ Bug Checker: FAIL" >> "$GITHUB_STEP_SUMMARY"
          echo "Three attempts failed. Human review required; do not merge." >> "$GITHUB_STEP_SUMMARY"
          exit 1
