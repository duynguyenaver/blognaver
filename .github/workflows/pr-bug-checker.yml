name: PR Bug Checker
run-name: "CI · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bug-checker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bug-checker:
    name: Bug Checker — Hugo (5 attempts, smart stop)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch main history required for JS diff audit
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base origin/main HEAD
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
          cache: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Cache Hugo module downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-pr-v2-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-pr-v2-
      - name: Test conflict resolver safety and Git integration
        run: python3 scripts/test-conflict-resolver.py
      - name: Validate bug knowledge classifier fixtures
        run: python3 scripts/test-ci-knowledge.py
      - name: Verify CMS V2 navigation and permalinks
        run: node scripts/test-cms-v2-router.mjs
      - name: Test BlogNaver article URL to TTS import
        run: node --test scripts/test-tts-url-import.mjs scripts/test-tts-50000-chars.mjs scripts/test-tts-dynamic-voice.mjs scripts/test-voiceover-preprocess.mjs
      - name: Bug checks with bounded retries and AGENTS.md guidance
        shell: bash
        run: |
          chmod +x scripts/pr-bug-checker.sh
          for attempt in 1 2 3 4 5; do
            echo "::group::Bug Checker attempt $attempt/5"
            if bash scripts/pr-bug-checker.sh 2>&1 | tee "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::endgroup::"
              echo "## ✅ Bug Checker PASS" >> "$GITHUB_STEP_SUMMARY"
              echo "Passed attempt $attempt/5 on the checked revision. No source modifications by CI." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            python3 scripts/ci-classify-failure.py --log "$RUNNER_TEMP/bug-check-$attempt.log" --out "$RUNNER_TEMP/bug-diagnosis-$attempt.json"
            echo "### Attempt $attempt: knowledge base classification" >> "$GITHUB_STEP_SUMMARY"
            set +e
            python3 scripts/ci-agent-playbook.py --diagnosis "$RUNNER_TEMP/bug-diagnosis-$attempt.json" --attempt "$attempt" | tee -a "$GITHUB_STEP_SUMMARY"
            decision=${PIPESTATUS[0]}
            set -e
            if grep -Eiq 'JS diff audit unavailable|merge-base.*exit status 128|Not a valid object name origin/main|"category": "tooling"' "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::error::Deterministic Git history error. Resolve checkout and fetch; do not retry." 
              break
            fi
            if [ "$decision" -ne 0 ]; then
              echo "::error::Non-retryable source error or exhausted retry budget. See AGENTS.md notes in the summary."
              break
            fi
            case "$attempt" in 1) delay=10 ;; 2) delay=20 ;; 3) delay=30 ;; 4) delay=45 ;; esac
            echo "::warning::Retry transient failure after ${delay}s (attempt $((attempt+1))/5)."
            sleep "$delay"
          done
          echo "::error::Bug Checker failed: cause and remediation in Job Summary."
          echo "## ❌ Bug Checker FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "No approval/merge. Deterministic failures require a new source commit; CI did not change code." >> "$GITHUB_STEP_SUMMARY"
          exit 1
