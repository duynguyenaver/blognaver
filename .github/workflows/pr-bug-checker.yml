name: PR Bug Checker

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bug-checker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bug-checker:
    name: Bug Checker — Blowfish (3 attempts max)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch base branch history for changed-file audits
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base origin/main HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Bug checks, known-fix guidance and 2 retries
        shell: bash
        run: |
          chmod +x scripts/pr-bug-checker.sh
          for attempt in 1 2 3; do
            echo "::group::Bug Checker attempt $attempt/3"
            if bash scripts/pr-bug-checker.sh 2>&1 | tee "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::endgroup::"
              echo "## ✅ Bug Checker PASS" >> "$GITHUB_STEP_SUMMARY"
              echo "Passed attempt $attempt/3. CI auto-review may proceed; merge is manual." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            # Known safe remediation guidance only; NEVER execute guessed or downloaded fixes.
            if grep -Eq 'dateFormat.*type string|colorScheme.*type string' "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::warning::Known Hugo theme config mismatch: check config/_default/params.toml and languages.vi.toml (AGENTS.md)."
              echo "- Known issue: theme config schema mismatch. Compare against active theme's configuration." >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eiq 'Dart Sass binary|TOCSS-DART|no Dart Sass' "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::warning::Known Sass failure: validate required Dart Sass executable (AGENTS.md)."
              echo "- Known issue: missing/incompatible Dart Sass. Check executable/version in CI." >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eiq 'JS diff audit unavailable|merge-base.*exit status 128|Not a valid object name origin/main' "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::error::Git history not available for changed-file audit. Fetch origin/main with fetch-depth: 0."
              echo "- Deterministic CI tooling failure: missing base branch Git history. Repair checkout/fetch rather than repeating unchanged checks." >> "$GITHUB_STEP_SUMMARY"
              break
            elif grep -Eiq 'module.*not found|failed to download modules' "$RUNNER_TEMP/bug-check-$attempt.log"; then
              echo "::warning::Check Hugo module import, version and Go dependency cache."
              echo "- Hugo module retrieval failure: verify module path/version and connectivity." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Unknown failure. Inspect build log; do not auto-modify source from an unverified guess."
              echo "- Unclassified failure: consult job logs and upstream theme/Hugo docs before manual fix." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Retry after 10s (attempt $((attempt+1))/3)."
              sleep 10
            fi
          done
          echo "::error::Bug Checker failed all 3 attempts; stop here."
          echo "## ❌ Bug Checker FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "All three attempts failed. No approval or merge; human intervention required." >> "$GITHUB_STEP_SUMMARY"
          exit 1
