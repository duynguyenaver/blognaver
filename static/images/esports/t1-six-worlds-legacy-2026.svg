<text x="800" y="857" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#f4b7b8">BLOGNAVER  /  LỊCH SỬ CÁC ĐỘI TUYỂN LOL THẾ GIỚI  /  KỲ 03</text>
