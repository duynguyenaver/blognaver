colorScheme = "blognaver-blue"
defaultAppearance = "dark"
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true
disableImageOptimization = false
defaultBackgroundImage = "images/blognaver-aurora.svg"
backgroundCanvas = false
mainSections = ["posts"]
[header]
  layout = "fixed"
[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true
[homepage]
  layout = "custom"
  homepageImage = "images/blognaver-aurora.svg"
  showRecent = true
  showRecentItems = 12
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = false
[article]
  showDate = true
  showDateUpdated = true
  showBreadcrumbs = false
  showHero = false
  heroStyle = "background"
  showSummary = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = false
  showTaxonomies = true
  showRelatedContent = true
  relatedContentLimit = 3
[list]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showSummary = false
  showTableOfContents = false
  showCards = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
