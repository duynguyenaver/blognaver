mainSections = ["posts"]
rssFullContent = true
SortBy = "default"

[footer]
  since = 2026
  customText = ""

[dateFormat]
  published = ":date_medium"
  lastUpdated = ":date_medium"

[sidebar]
  compact = false
  emoji = "📝"
  subtitle = "Công nghệ · Hàn Quốc · Cuộc sống"
  avatar = ""

[article]
  headingAnchor = true
  math = false
  toc = true
  readingTime = true
  [article.list]
    showTags = true
  [article.license]
    enabled = false

[widgets]
  homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 15 } },
  ]
  page = [{ type = "toc" }]

[colorScheme]
  toggle = true
  default = "light"

[comments]
  enabled = false

[imageProcessing]
  autoOrient = false
  [imageProcessing.external]
    timeout = "5s"
  [imageProcessing.content]
    enabled = true
    widths = [800, 1600, 2400]
  [imageProcessing.thumbnail]
    enabled = true
